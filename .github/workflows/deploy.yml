name: Build and deploy WillkanPosts

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: willkan-posts-production
  cancel-in-progress: false

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_REPOSITORY: registry.cn-hangzhou.aliyuncs.com/xiagan/willkan-posts

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Fetch verified 花哪 Android release
        env:
          HUANA_APK_SHA256: 322c40d5e2802e9f95adc2ab97de745788fedb4e9664cb6ef1e0d8e2a8faa83e
        run: |
          curl --fail --location --retry 3 \
            --output .release/huana-1.0.0.apk \
            https://github.com/willkan/ho-bookkeeping/releases/download/v1.0.0/huana-1.0.0.apk
          printf '%s  %s\n' "$HUANA_APK_SHA256" .release/huana-1.0.0.apk |
            sha256sum --check

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment contract
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment contract
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: scp deploy/docker-compose.yml "deploy@$ECS_HOST:/tmp/willkan-posts-compose.yml"

      - name: Log the server in to Aliyun Container Registry
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          printf '%s' "$ALIYUN_DOCKER_PASSWORD" |
            ssh "deploy@$ECS_HOST" docker login \
              --username "$ALIYUN_DOCKER_USERNAME" \
              --password-stdin "$REGISTRY"

      - name: Deploy immutable image
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "deploy@$ECS_HOST" \
            "IMAGE_REPOSITORY=$IMAGE_REPOSITORY IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -euo pipefail

          cd /var/willkan-posts
          if [ -f docker-compose.yml ]; then
            cp -a docker-compose.yml docker-compose.previous.yml
          fi
          install -m 0644 /tmp/willkan-posts-compose.yml docker-compose.yml
          rm -f /tmp/willkan-posts-compose.yml

          printf 'IMAGE_REPOSITORY=%s\nIMAGE_TAG=%s\n' \
            "$IMAGE_REPOSITORY" "$IMAGE_TAG" > .env.next
          mv .env.next .env

          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans

          healthy=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' willkan-posts 2>/dev/null || true)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker compose ps
            docker logs --tail 100 willkan-posts
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18081/healthz
          docker compose ps
          REMOTE
